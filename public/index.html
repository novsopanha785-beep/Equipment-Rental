<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={equipment:[],borrowers:[],rentals:[],types:[],hasTypes:true,page:'dashboard',filter:'all',query:'',online:true};
const api=async(method,url,body)=>{let r;try{r=await fetch(url,{method,headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});}catch(e){throw new Error('Cannot connect to the server. Please run npm start.')}let d;try{d=await r.json()}catch(e){d={}}if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>v?new Date(v).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const timeAgo=v=>{if(!v)return '';const m=Math.max(0,Math.floor((Date.now()-new Date(v))/60000));if(m<60)return `${m} min ago`;const h=Math.floor(m/60);if(h<24)return `${h} hr ago`;return `${Math.floor(h/24)} days ago`};
const active=p=>p.endedAt===null;
const currentForEquipment=id=>state.rentals.find(p=>p.itemId===id&&active(p));
const borrower=id=>state.borrowers.find(v=>v.id===id);
const equipment=id=>state.equipment.find(s=>s.id===id);
const rentedBorrowers=()=>new Set(state.rentals.filter(active).map(p=>p.personId));
const fmtMoney=n=>'$'+Number(n||0).toFixed(2);
let toastTimer;
function toast(message,error=false){const el=$('#toast');el.textContent=message;el.className='toast show'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='toast',2800)}
async function load(){try{const root=await api('GET','/');state.hasTypes=root.resources.includes('/types');const [equipment,borrowers,rentals,types]=await Promise.all([api('GET','/equipment'),api('GET','/borrowers'),api('GET','/rentals'),state.hasTypes?api('GET','/types'):Promise.resolve([])]);Object.assign(state,{equipment,borrowers,rentals,types,online:true});}catch(e){state.online=false;state.error=e.message}render()}
function stats(){const total=state.equipment.length,used=state.equipment.filter(s=>currentForEquipment(s.id)).length;return{total,used,free:total-used,rate:total?Math.round(used/total*100):0,borrowers:state.borrowers.length,active:state.rentals.filter(active).length}}
function pageHead(kicker,title,desc,actions=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
function statCard(label,value,sub,icon,color='blue'){const bg=color==='green'?'var(--greenbg)':color==='red'?'var(--redbg)':color==='amber'?'var(--amberbg)':'var(--blue2)',fg=color==='green'?'var(--green)':color==='red'?'var(--red)':color==='amber'?'var(--amber)':'var(--blue)';return `<article class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon" style="background:${bg};color:${fg}">${icon}</span></div><strong>${value}</strong><div class="stat-foot">${sub}</div></article>`}
const ico={equipment:'▦',car:'▰',clock:'◷',check:'✓'};
function recentRows(limit=5){return [...state.rentals].sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt)).slice(0,limit).map(p=>{const s=equipment(p.itemId),v=borrower(p.personId);return `<div class="activity-row"><div class="activity-icon ${p.endedAt?'red':''}">${p.endedAt?'↙':'↗'}</div><div class="activity-text"><b>${esc(v?.name||'Unknown borrower')} · ${esc(s?.name||'Removed equipment')}</b><small>${p.endedAt?'Equipment returned':'Equipment rented out'}</small></div><div class="activity-time">${timeAgo(p.endedAt||p.startedAt)}</div></div>`}).join('')||'<div class="empty">No rental activity yet.</div>'}

.btn.secondary{background:#fff;border:1px solid var(--line);color:#4d473d}.btn.secondary:hover{background:#f3ede1}.btn.danger{background:#fff;border:1px solid #efc9c2;color:var(--red)}.btn.danger:hover{background:var(--redbg)}.btn.success{background:var(--green)}.btn.sm{padding:6px 12px;font-size:11px}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}

.panel-head{padding:18px 22px;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.panel-head h3{margin:0;font:700 17px Georgia,serif}.panel-head p{margin:3px 0 0;font-size:11.5px;color:var(--muted)}.panel-body{padding:20px 22px}
.link{border:0;background:none;color:var(--blue);font-weight:750;font-size:12px}.link:hover{text-decoration:underline}
.occupancy{display:flex;align-items:center;gap:24px}.ring{width:140px;height:140px;border-radius:50%;background:conic-gradient(var(--blue) var(--pct),#ece5d7 0);display:grid;place-items:center;flex:none;position:relative}.ring:before{content:"";position:absolute;inset:14px;background:var(--white);border-radius:50%}.ring div{position:relative;text-align:center}.ring strong{display:block;font:700 28px Georgia,serif}.ring small{font-size:9px;letter-spacing:1.2px;color:var(--muted)}
.legend{display:grid;gap:12px;flex:1}.legend-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}.legend-label{display:flex;align-items:center;gap:8px;color:#6d665a}.swatch{width:10px;height:10px;border-radius:50%}
.chart{height:160px;display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid var(--line);padding-top:8px}.bar-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}.bar{width:min(26px,70%);border-radius:999px 999px 4px 4px;background:var(--blue);min-height:4px}.bar-col small{font-size:10px;color:var(--muted)}
.activity{display:grid}.activity-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}.activity-row:last-child{border:0}.activity-icon{width:32px;height:32px;border-radius:50%;background:var(--amberbg);color:var(--amber);display:grid;place-items:center}.activity-icon.red{background:var(--greenbg);color:var(--green)}.activity-text{flex:1;min-width:0}.activity-text b{display:block;font-size:12.5px}.activity-text small,.activity-time{font-size:11px;color:var(--muted)}.activity-time{white-space:nowrap}
.lot-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}.filter-pills{display:flex;gap:6px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;color:#6d665a}.pill.active{background:var(--ink);border-color:var(--ink);color:#fff}
.rental-map{background:transparent;padding:0;color:var(--ink)}.map-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.map-head b{font:700 18px Georgia,serif}.map-head span{font-size:11px;color:var(--muted)}
.equipment-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.equipment-tile{background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:22px 16px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;position:relative;overflow:hidden}
.equipment-tile:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--green)}.equipment-tile.busy:before{background:var(--amber)}
.equipment-tile .car-icon{width:54px;height:54px;border-radius:16px;background:var(--greenbg);display:grid;place-items:center;font-size:25px;color:var(--green);margin-bottom:6px}.equipment-tile.busy .car-icon{background:var(--amberbg)}
.equipment-tile strong{font-size:13.5px;line-height:1.3}.equipment-tile small{font-size:11.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.equipment-tile .state{font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--green)}.equipment-tile.busy .state{color:var(--amber)}
.equipment-tile button{margin-top:8px;width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px;font-size:11.5px;font-weight:750;color:var(--ink)}.equipment-tile button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:620px}.table th{text-align:left;padding:12px 18px;color:var(--muted);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:800;background:#faf5ea}.table td{padding:14px 18px;border-top:1px solid var(--line);font-size:12.5px;vertical-align:middle}.table tbody tr:hover{background:#fbf8f1}
.muted{color:var(--muted)}.strong{font-weight:750}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:10.5px;font-weight:750}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.status.green{background:var(--greenbg);color:#26703f}.status.red,.status.amber{background:var(--amberbg);color:#a5671a}
.table-search{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:#faf6ee;outline:none;font-size:12px;min-width:200px}.table-search:focus{border-color:var(--blue);background:#fff}
.empty{padding:44px 18px;text-align:center;color:var(--muted);font-size:13px}.empty b{display:block;color:var(--ink);margin-bottom:5px;font:700 16px Georgia,serif}
.type-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.type-card{padding:20px;background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.type-card h3{margin:0 0 4px;font:700 18px Georgia,serif}.type-card p{margin:0;font-size:12px;color:var(--muted)}.type-count{font:700 30px Georgia,serif;margin-top:16px}.type-count small{font:600 11px "Segoe UI",sans-serif;color:var(--muted)}
.progress{height:7px;background:#ece5d7;border-radius:99px;margin-top:10px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue);border-radius:99px}
.report-grid{grid-template-columns:1fr 1fr}.report-card{padding:22px}.report-card h3{margin:0;font:700 17px Georgia,serif}.report-card p{font-size:12px;color:var(--muted);margin:4px 0 18px}.report-number{font:700 42px Georgia,serif;letter-spacing:-1.5px;margin-bottom:6px}
.report-bars{display:grid;gap:13px}.report-bar{display:grid;grid-template-columns:92px 1fr 30px;gap:10px;align-items:center;font-size:11px;color:var(--muted)}.report-bar div{height:9px;background:#ece5d7;border-radius:99px;overflow:hidden}.report-bar div span{display:block;height:100%;background:var(--blue);border-radius:99px}
.footer-note{text-align:center;color:var(--muted);font-size:11px;margin-top:28px}
.modal{border:0;border-radius:22px;padding:0;width:min(460px,calc(100vw - 28px));background:var(--white);color:var(--ink);box-shadow:0 30px 90px #2a1f0e55}.modal::backdrop{background:#2b241a99;backdrop-filter:blur(3px)}
.modal-head{padding:20px 24px;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0;font:700 20px Georgia,serif}.modal-body{padding:20px 24px}.modal-error{color:var(--red);font-size:12px;min-height:16px}.modal-foot{padding:14px 24px 20px;display:flex;justify-content:flex-end;gap:8px}
.field{display:block;margin-bottom:14px;font-size:12px;font-weight:750;color:#4d473d}.field input,.field select{display:block;width:100%;margin-top:6px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;font-size:13px}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1f6f5c1f}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:650;opacity:0;pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:var(--red)}
.api-error{background:var(--redbg);color:var(--red);border:1px solid #efc9c2;border-radius:14px;padding:18px;margin-bottom:14px}
@media(max-width:1000px){.topbar{flex-wrap:wrap;height:auto;padding:12px 18px;gap:10px}.sidebar{order:3;flex-basis:100%}.stats{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.equipment-grid{grid-template-columns:repeat(3,1fr)}.type-grid{grid-template-columns:repeat(2,1fr)}.content{padding:26px 18px 50px}}
@media(max-width:620px){.searchbox input{width:130px}.pagehead h1{font-size:27px}.equipment-grid{grid-template-columns:repeat(2,1fr)}.type-grid,.report-grid{grid-template-columns:1fr}.stat strong{font-size:30px}.occupancy{gap:14px}.ring{width:112px;height:112px}.activity-time{display:none}}
@media print{.topbar{display:none}.btn,.actions,.link{display:none!important}.panel,.stat{box-shadow:none;break-inside:avoid}}
</style>

<body>
<div class="shell">
<section class="main">
<header class="topbar"><div class="brand"><div class="brand-mark">R</div><div><strong>RentEasy</strong><small>Equipment rental</small></div></div><aside class="sidebar" id="sidebar"><nav class="nav" id="nav">
    <button data-page="dashboard" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg>Dashboard</button>
    <button data-page="lot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V4h16v16M8 20V8h8v12M2 20h20"/><path d="M10 11h4"/></svg>Live inventory</button>
    <div class="nav-label">MANAGEMENT</div>
    <button data-page="borrowers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m5 11 1.5-5h11L19 11l2 2v6h-2v-2H5v2H3v-6l2-2Z"/><path d="M6.5 14h.01M17.5 14h.01M7 11h10"/></svg>Borrowers</button>
    <button data-page="equipment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>Equipment</button>
    <button data-page="types"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21V7l9-4 9 4v14M3 11h18M8 21v-5h8v5"/></svg>Types</button>
    <button data-page="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>Rental history</button>
    <div class="nav-label">INSIGHTS</div>
    <button data-page="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h17M8 16v-4M13 16V7M18 16v-7"/></svg>Reports</button>
  </nav></aside><span class="crumb"><b id="crumb">Dashboard</b></span><button class="iconbtn mobile-menu" id="menuBtn" aria-label="Menu">☰</button><div class="top-actions"><div class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg><input id="globalSearch" placeholder="Search borrowers, equipment…" aria-label="Search" /></div><button class="iconbtn" id="refreshBtn" title="Refresh data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 11.8-2L20 12M4 12l2.7 5a7 7 0 0 0 11.8-2"/></svg></button></div></header>
<main class="content" id="view"><div class="empty">Loading rental operations…</div></main>
</section>
</div>
<dialog class="modal" id="modal"><form id="modalForm"><div class="modal-head"><h3 id="modalTitle">Add record</h3><button type="button" class="iconbtn" id="modalClose">×</button></div><div class="modal-body" id="modalFields"></div><div class="modal-error" id="modalError" style="padding:0 22px"></div><div class="modal-foot"><button type="button" class="btn secondary" id="modalCancel">Cancel</button><button class="btn" id="modalSubmit">Save record</button></div></form></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={equipment:[],borrowers:[],rentals:[],types:[],hasTypes:true,page:'dashboard',filter:'all',query:'',online:true};
const api=async(method,url,body)=>{let r;try{r=await fetch(url,{method,headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});}catch(e){throw new Error('Cannot connect to the server. Please run npm start.')}let d;try{d=await r.json()}catch(e){d={}}if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>v?new Date(v).toLocaleString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const timeAgo=v=>{if(!v)return '';const m=Math.max(0,Math.floor((Date.now()-new Date(v))/60000));if(m<60)return `${m} min ago`;const h=Math.floor(m/60);if(h<24)return `${h} hr ago`;return `${Math.floor(h/24)} days ago`};
const active=p=>p.endedAt===null;
const currentForEquipment=id=>state.rentals.find(p=>p.itemId===id&&active(p));
const borrower=id=>state.borrowers.find(v=>v.id===id);
const equipment=id=>state.equipment.find(s=>s.id===id);
const rentedBorrowers=()=>new Set(state.rentals.filter(active).map(p=>p.personId));
const fmtMoney=n=>'$'+Number(n||0).toFixed(2);
let toastTimer;
function toast(message,error=false){const el=$('#toast');el.textContent=message;el.className='toast show'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='toast',2800)}
async function load(){try{const root=await api('GET','/');state.hasTypes=root.resources.includes('/types');const [equipment,borrowers,rentals,types]=await Promise.all([api('GET','/equipment'),api('GET','/borrowers'),api('GET','/rentals'),state.hasTypes?api('GET','/types'):Promise.resolve([])]);Object.assign(state,{equipment,borrowers,rentals,types,online:true});}catch(e){state.online=false;state.error=e.message}render()}
function stats(){const total=state.equipment.length,used=state.equipment.filter(s=>currentForEquipment(s.id)).length;return{total,used,free:total-used,rate:total?Math.round(used/total*100):0,borrowers:state.borrowers.length,active:state.rentals.filter(active).length}}
function pageHead(kicker,title,desc,actions=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
function statCard(label,value,sub,icon,color='blue'){const bg=color==='green'?'var(--greenbg)':color==='red'?'var(--redbg)':color==='amber'?'var(--amberbg)':'var(--blue2)',fg=color==='green'?'var(--green)':color==='red'?'var(--red)':color==='amber'?'var(--amber)':'var(--blue)';return `<article class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon" style="background:${bg};color:${fg}">${icon}</span></div><strong>${value}</strong><div class="stat-foot">${sub}</div></article>`}
const ico={equipment:'▦',car:'▰',clock:'◷',check:'✓'};
function recentRows(limit=5){return [...state.rentals].sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt)).slice(0,limit).map(p=>{const s=equipment(p.itemId),v=borrower(p.personId);return `<div class="activity-row"><div class="activity-icon ${p.endedAt?'red':''}">${p.endedAt?'↙':'↗'}</div><div class="activity-text"><b>${esc(v?.name||'Unknown borrower')} · ${esc(s?.name||'Removed equipment')}</b><small>${p.endedAt?'Equipment returned':'Equipment rented out'}</small></div><div class="activity-time">${timeAgo(p.endedAt||p.startedAt)}</div></div>`}).join('')||'<div class="empty">No rental activity yet.</div>'}
function dashboard(){const s=stats(),occupancy=s.total?Math.round(s.used/s.total*100):0;const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d});const daily=days.map(d=>state.rentals.filter(p=>{const x=new Date(p.startedAt);return x.toDateString()===d.toDateString()}).length);const max=Math.max(1,...daily);return `${pageHead('OVERVIEW','Good day, Administrator','Here is what is happening in your rental shop right now.',`${state.equipment.length===0&&state.borrowers.length===0?'<button class="btn secondary" data-action="demo-data">＋ Load demo data</button>':''}<button class="btn secondary" data-action="export">⇩ Export data</button><button class="btn" data-action="new-rental">＋ New rental</button>`)}<section class="grid stats">${statCard('Total equipment',s.total,'Items in inventory', '▦')}${statCard('Available items',s.free,`${s.total?Math.round(s.free/s.total*100):0}% of total capacity`,'✓','green')}${statCard('Rented out',s.used,'Currently rented items','▰','red')}${statCard('Registered borrowers',s.borrowers,'Borrowers in database','◉','amber')}</section><section class="grid two-col"><article class="panel"><div class="panel-head"><div><h3>Rental utilization</h3><p>Live utilization across all equipment</p></div><span class="status ${occupancy>=85?'red':'green'}">${occupancy>=85?'High utilization':'Live status'}</span></div><div class="panel-body"><div class="occupancy"><div class="ring" style="--pct:${occupancy*3.6}deg"><div><strong>${occupancy}%</strong><small>RENTED</small></div></div><div class="legend"><div class="legend-row"><span class="legend-label"><i class="swatch" style="background:var(--blue)"></i>Rented out</span><b>${s.used}</b></div><div class="legend-row"><span class="legend-label"><i class="swatch" style="background:#d9d2c3"></i>Available</span><b>${s.free}</b></div><div class="legend-row"><span class="legend-label"><i class="swatch" style="background:var(--amber)"></i>Total capacity</span><b>${s.total}</b></div><button class="link" style="text-align:left;padding:8px 0 0" data-go="lot">View live inventory →</button></div></div></div></article><article class="panel"><div class="panel-head"><div><h3>Rental activity</h3><p>Rentals started in the last 7 days</p></div><button class="link" data-go="reports">Full report →</button></div><div class="panel-body"><div class="chart">${daily.map((n,i)=>`<div class="bar-col"><div class="bar" title="${n} rentals" style="height:${Math.max(3,n/max*100)}%"></div><small>${days[i].toLocaleDateString(undefined,{weekday:'short'})}</small></div>`).join('')}</div></div></article></section><section class="grid two-col"><article class="panel"><div class="panel-head"><div><h3>Recent rentals</h3><p>Latest activity from your inventory</p></div><button class="link" data-go="history">View all →</button></div><div class="panel-body"><div class="activity">${recentRows(5)}</div></div></article><article class="panel"><div class="panel-head"><div><h3>Shop summary</h3><p>Quick operational overview</p></div></div><div class="panel-body"><div class="legend"><div class="legend-row"><span class="legend-label">Total types</span><b>${state.types.length}</b></div><div class="legend-row"><span class="legend-label">Completed rentals</span><b>${state.rentals.filter(p=>!active(p)).length}</b></div><div class="legend-row"><span class="legend-label">Active rentals</span><b>${s.active}</b></div><div class="legend-row"><span class="legend-label">Capacity utilization</span><b>${occupancy}%</b></div></div><div style="margin-top:20px"><button class="btn secondary" style="width:100%;justify-content:center" data-go="borrowers">Manage registered borrowers</button></div></div></article></section><div class="footer-note">RentEasy Equipment Rental System · Data is stored locally on your Node.js server</div>`}
function liveLot(){const s=stats();return `${pageHead('OPERATIONS','Live inventory','Monitor every item and manage rentals and returns.',`<button class="btn secondary" data-action="add-equipment">＋ Add equipment</button><button class="btn" data-action="new-rental">＋ New rental</button>`)}<div class="lot-toolbar"><div class="filter-pills"><button class="pill ${state.filter==='all'?'active':''}" data-filter="all">All equipment (${s.total})</button><button class="pill ${state.filter==='free'?'active':''}" data-filter="free">Available (${s.free})</button><button class="pill ${state.filter==='busy'?'active':''}" data-filter="busy">Rented out (${s.used})</button></div><span class="muted" style="font-size:11px">Updated ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div><div class="rental-map"><div class="map-head"><b>EQUIPMENT INVENTORY</b><span>● ${s.free} available &nbsp; ● ${s.used} rented out</span></div><div class="equipment-grid">${state.equipment.filter(x=>state.filter==='all'||(state.filter==='free'?!currentForEquipment(x.id):!!currentForEquipment(x.id))).map(x=>{const p=currentForEquipment(x.id),v=p&&borrower(p.personId);return `<div class="equipment-tile ${p?'busy':'free'}"><div class="car-icon">${p?'📦':'▢'}</div><strong>${esc(x.name)}</strong><small>${p?esc(v?.name||'Unknown borrower'):'Ready to rent'}</small><span class="state">${p?'Rented out':'Available'}</span>${p?`<button data-action="checkout" data-id="${p.id}">Return equipment</button>`:`<button data-action="rent-item" data-equipment="${x.id}">Rent out</button>`}</div>`}).join('')||'<div class="empty" style="grid-column:1/-1;color:var(--muted)">No equipment matches this filter.</div>'}</div></div><div class="grid stats" style="margin-top:17px">${statCard('Capacity',s.total,'Total items','▦')}${statCard('Available',s.free,'Ready to rent','✓','green')}${statCard('Rented out',s.used,'Currently rented','▰','red')}${statCard('Utilization',s.rate+'%','Current utilization rate','◉','amber')}</div>`}
function badge(p){return p.endedAt?'<span class="status green">Completed</span>':'<span class="status red">Rented now</span>'}
function tablePanel(headers,rows,empty,search=true){return `<div class="panel"><div class="panel-head"><div><h3>${empty.title||'Records'}</h3><p>${empty.sub||''}</p></div>${search?'<input class="table-search" data-search placeholder="Search records…">':''}</div><div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}"><div class="empty"><b>${empty.message||'No records found'}</b>${empty.hint||''}</div></td></tr>`}</tbody></table></div></div>`}
function borrowersPage(){const rows=state.borrowers.map(v=>`<tr data-search-row="${esc([v.id,v.name,v.phone].join(' ').toLowerCase())}"><td class="muted">BR-${String(v.id).padStart(4,'0')}</td><td><b class="strong">${esc(v.name)}</b></td><td>${esc(v.phone||'—')}</td><td>${(n=>n?`<span class="status red">${n} active rental${n>1?'s':''}</span>`:'<span class="status green">No active rentals</span>')(state.rentals.filter(p=>active(p)&&p.personId===v.id).length)}</td><td><button class="btn secondary sm" data-action="edit" data-kind="borrowers" data-id="${v.id}">Edit</button> <button class="btn danger sm" data-action="delete" data-kind="borrowers" data-id="${v.id}">Delete</button></td></tr>`).join('');return `${pageHead('MANAGEMENT','Borrower registry','Register and maintain borrower details for equipment rentals.',`<button class="btn" data-action="add" data-kind="borrowers">＋ Register borrower</button>`)}${tablePanel(['Borrower ID','Borrower name','Phone','Rental status','Actions'],rows,{title:'Registered borrowers',sub:`${state.borrowers.length} borrowers in your database`,message:'No borrowers registered',hint:'Add a borrower to start a rental.'})}`}
function equipmentPage(){const rows=state.equipment.map(v=>`<tr data-search-row="${esc([v.id,v.name,v.note].join(' ').toLowerCase())}"><td class="muted">EQ-${String(v.id).padStart(4,'0')}</td><td><b class="strong">${esc(v.name)}</b></td><td>${esc(v.note||'—')}</td><td>${currentForEquipment(v.id)?'<span class="status red">Rented out</span>':'<span class="status green">Available</span>'}</td><td><button class="btn secondary sm" data-action="edit" data-kind="equipment" data-id="${v.id}">Edit</button> <button class="btn danger sm" data-action="delete" data-kind="equipment" data-id="${v.id}">Delete</button></td></tr>`).join('');return `${pageHead('MANAGEMENT','Equipment','Add and organize the equipment available for rent.',`<button class="btn" data-action="add" data-kind="equipment">＋ Add equipment</button>`)}${tablePanel(['Equipment ID','Equipment name','Description','Availability','Actions'],rows,{title:'Equipment directory',sub:`${state.equipment.length} items in inventory`,message:'No equipment added',hint:'Add equipments to build your rental lot.'})}`}
function typesPage(){const rows=state.types.map(z=>{const ss=state.equipment.filter(s=>String(s.note||'').toLowerCase().includes(z.name.toLowerCase()));const used=ss.filter(s=>currentForEquipment(s.id)).length;return `<article class="type-card"><div style="display:flex;justify-content:space-between;gap:8px"><div><h3>${esc(z.name)}</h3><p>${esc(z.note||'Equipment type')}</p></div><span class="status green">Active</span></div><div class="type-count">${ss.length}<small> items matched</small></div><div class="progress"><span style="width:${ss.length?used/ss.length*100:0}%"></span></div><div style="display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:10px"><span>${used} rented out</span><span>${ss.length-used} available</span></div><div style="margin-top:15px"><button class="btn secondary sm" data-action="edit" data-kind="types" data-id="${z.id}">Edit type</button> <button class="btn danger sm" data-action="delete" data-kind="types" data-id="${z.id}">Delete</button></div></article>`}).join('');return `${pageHead('MANAGEMENT','Equipment types','Group equipment by category, such as Electronics or Tools.',`<button class="btn" data-action="add" data-kind="types">＋ Add type</button>`)}<div class="grid type-grid">${rows||'<div class="panel empty" style="grid-column:1/-1"><b>No types created</b>Create types to organize your equipment.</div>'}</div><p class="muted" style="font-size:10px;margin-top:14px">Note: an item is counted under a type when its description mentions the type name.</p>`}
function historyPage(){const list=[...state.rentals].sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt));const rows=list.map(p=>{const v=borrower(p.personId),s=equipment(p.itemId);return `<tr data-search-row="${esc([p.id,v?.name,s?.name,p.endedAt?'completed':'active'].join(' ').toLowerCase())}"><td class="muted">RN-${String(p.id).padStart(4,'0')}</td><td><b class="strong">${esc(v?.name||'Unknown borrower')}</b></td><td>${esc(s?.name||'Removed equipment')}</td><td>${date(p.startedAt)}</td><td>${p.endedAt?date(p.endedAt):'<span class="muted">In progress</span>'}</td><td>${badge(p)}</td><td>${p.endedAt?'':`<button class="btn success sm" data-action="checkout" data-id="${p.id}">Return</button>`} <button class="btn danger sm" data-action="delete-rental" data-id="${p.id}">Delete</button></td></tr>`}).join('');return `${pageHead('MANAGEMENT','Rental history','Review active and completed rentals.',`<button class="btn secondary" data-action="export">⇩ Export CSV</button><button class="btn" data-action="new-rental">＋ New rental</button>`)}${tablePanel(['Rental ID','Borrower','Equipment','Rented at','Returned at','Status','Actions'],rows,{title:'All rentals',sub:`${list.length} total records`,message:'No rentals yet',hint:'New rental rentals will appear here.'})}`}
function reportsPage(){const total=state.rentals.length,done=state.rentals.filter(p=>p.endedAt),ongoing=total-done.length;const avg=done.length?Math.round(done.reduce((n,p)=>n+(new Date(p.endedAt)-new Date(p.startedAt))/60000,0)/done.length):0;const hours=[0,0,0,0,0,0];state.rentals.forEach(p=>{const h=new Date(p.startedAt).getHours();hours[Math.min(5,Math.floor(h/4))]++});const max=Math.max(1,...hours);return `${pageHead('INSIGHTS','Reports & analytics','A clear overview of rental activity and inventory performance.',`<button class="btn secondary" data-action="export">⇩ Export CSV</button><button class="btn" data-action="print">Print report</button>`)}<div class="grid stats">${statCard('Total rentals',total,'All recorded entries','◷')}${statCard('Completed rentals',done.length,'Items returned','✓','green')}${statCard('Active rentals',ongoing,'Items currently rented','▰','red')}${statCard('Average rental time',avg?avg+' min':'—','Based on completed rentals','⌁','amber')}</div><div class="grid report-grid"><article class="panel report-card"><h3>Rental status</h3><p>Distribution of all recorded rentals</p><div class="report-number">${total?Math.round(done.length/total*100):0}%</div><div class="progress" style="height:10px"><span style="width:${total?done.length/total*100:0}%;background:var(--green)"></span></div><div class="legend" style="margin-top:18px"><div class="legend-row"><span class="legend-label">Completed</span><b>${done.length}</b></div><div class="legend-row"><span class="legend-label">Active</span><b>${ongoing}</b></div></div></article><article class="panel report-card"><h3>Activity by time of day</h3><p>Rentals grouped into four-hour periods</p><div class="report-bars">${hours.map((n,i)=>`<div class="report-bar"><span>${['12 AM–4 AM','4 AM–8 AM','8 AM–12 PM','12 PM–4 PM','4 PM–8 PM','8 PM–12 AM'][i]}</span><div><span style="width:${n/max*100}%"></span></div><b>${n}</b></div>`).join('')}</div></article></div><p class="muted" style="font-size:10px;margin-top:16px">Reports are calculated from the rental records currently stored in the local JSON database. No payment or revenue data is collected by this project.</p>`}
function render(){const pages={dashboard,lot:liveLot,borrowers:borrowersPage,equipment:equipmentPage,types:typesPage,history:historyPage,reports:reportsPage};const labels={dashboard:'Dashboard',lot:'Live inventory',borrowers:'Borrowers',equipment:'Equipment',types:'Types',history:'Rental history',reports:'Reports'};$('#crumb').textContent=labels[state.page];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));if(!state.online){$('#view').innerHTML=`<div class="api-error"><b>Server connection unavailable.</b><br>${esc(state.error||'Please start the Node.js server and refresh this page.')}</div><button class="btn" data-action="refresh">Retry connection</button>`;return}$('#view').innerHTML=pages[state.page]();}
function fieldsFor(kind,record){if(kind==='borrowers')return[{key:'name',label:'Borrower name',required:true,placeholder:'e.g. Sokha Chan',value:record?.name},{key:'phone',label:'Phone number',placeholder:'e.g. 012 345 678',value:record?.phone}];if(kind==='equipment')return[{key:'name',label:'Equipment name',required:true,placeholder:'e.g. Canon EOS R6 Camera',value:record?.name},{key:'note',label:'Description',placeholder:'e.g. Includes 2 batteries and charger',value:record?.note}];return[{key:'name',label:'Type name',required:true,placeholder:'e.g. Electronics',value:record?.name},{key:'note',label:'Description',placeholder:'e.g. Cameras, projectors, audio',value:record?.note}]}
function openModal(title,fields,submit){$('#modalTitle').textContent=title;$('#modalError').textContent='';$('#modalFields').innerHTML=fields.map(f=>`<label class="field">${esc(f.label)}${f.options?`<select name="${f.key}" ${f.required?'required':''}><option value="">Select…</option>${f.options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(f.value??'')?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`:`<input name="${f.key}" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}" ${f.required?'required':''}>`}</label>`).join('');$('#modalForm').onsubmit=async e=>{e.preventDefault();const values=Object.fromEntries(new FormData($('#modalForm')).entries());try{await submit(values);$('#modal').close()}catch(err){$('#modalError').textContent=err.message}};$('#modal').showModal();$('#modalFields').querySelector('input,select')?.focus()}
function editRecord(kind,id){const rec=id?state[kind].find(x=>x.id===Number(id)):null;openModal((rec?'Edit ':'Add ')+({borrowers:'borrower',equipment:'rental equipment',types:'type'}[kind]),fieldsFor(kind,rec),async v=>{const body={name:v.name.trim()};const extra=kind==='borrowers'?'phone':'note';if(v[extra]?.trim())body[extra]=v[extra].trim();if(rec)await api('PUT',`/${kind}/${id}`,body);else await api('POST',`/${kind}`,body);toast(rec?'Changes saved':'Record added');await load()})}
function newRental(preEquipment){const free=state.equipment.filter(s=>!currentForEquipment(s.id)),busy=rentedBorrowers(),cars=state.borrowers;if(!free.length)return toast('There is no available equipment.',true);if(!cars.length)return toast('Register a borrower first.',true);openModal('Start a rental',[{key:'itemId',label:'Select rental equipment',required:true,value:preEquipment,options:free.map(s=>({value:s.id,label:s.name}))},{key:'personId',label:'Select borrower',required:true,options:cars.map(v=>({value:v.id,label:v.name}))}],async v=>{await api('POST','/rentals',{itemId:Number(v.itemId),personId:Number(v.personId)});toast('Equipment rented out successfully');await load()})}
async function checkout(id){if(!confirm('Confirm equipment return?'))return;await api('PUT',`/rentals/${id}/end`);toast('Equipment returned');await load()}
function exportCsv(){const rows=[['Rental ID','Borrower','Equipment','Rented at','Returned at','Status'],...state.rentals.map(p=>[p.id,borrower(p.personId)?.name||'',equipment(p.itemId)?.name||'',p.startedAt,p.endedAt||'',p.endedAt?'Completed':'Active'])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='renteasy-rental-report.csv';a.click();URL.revokeObjectURL(url);toast('CSV report exported')}
document.addEventListener('click',async e=>{const nav=e.target.closest('[data-page]');if(nav){state.page=nav.dataset.page;state.filter='all';render();$('#sidebar').classList.remove('open');return}const go=e.target.closest('[data-go]');if(go){state.page=go.dataset.go;render();return}const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;render();return}const b=e.target.closest('[data-action]');if(!b)return;const {action,kind,id,equipment:equipmentId}=b.dataset;try{if(action==='add')editRecord(kind);else if(action==='edit')editRecord(kind,id);else if(action==='add-equipment')editRecord('equipment');else if(action==='new-rental')newRental();else if(action==='rent-item')newRental(Number(equipmentId));else if(action==='checkout')await checkout(id);else if(action==='delete'){const rec=state[kind].find(x=>x.id===Number(id));if(kind==='equipment'&&currentForEquipment(Number(id)))throw new Error('This equipment is currently rented out. Return it before deleting it.');if(kind==='borrowers'&&rentedBorrowers().has(Number(id)))throw new Error('This borrower has an active rental. Return the equipment before deleting the borrower.');if(!confirm(`Delete ${rec?.name||'this record'}?`))return;await api('DELETE',`/${kind}/${id}`);toast('Record deleted');await load()}else if(action==='delete-rental'){if(!confirm('Delete this rental history record?'))return;await api('DELETE',`/rentals/${id}`);toast('Rental record deleted');await load()}else if(action==='demo-data'){if(state.equipment.length||state.borrowers.length)return toast('Demo data can only be loaded into an empty project.',true);if(!confirm('Add example types, equipment, borrowers and rentals?'))return;for(const [name,note] of [['Electronics','Cameras, projectors, audio'],['Tools','Power and hand tools'],['Outdoor','Camping and sports gear']])await api('POST','/types',{name,note});for(const [name,note] of [['Canon EOS R6 Camera','Electronics · 24-70mm lens, 2 batteries'],['Epson Projector','Electronics · HDMI cable included'],['Portable PA Speaker','Electronics · Bluetooth, 1 wireless mic'],['Makita Power Drill','Tools · 18V cordless, 2 batteries'],['Angle Grinder','Tools · 115mm'],['Camping Tent (4 persons)','Outdoor · Waterproof']])await api('POST','/equipment',{name,note});for(const [name,phone] of [['Sokha Chan','012 345 678'],['Dara Pich','093 222 111'],['Srey Neang Vong','096 777 888'],['Vannak Sok','077 112 233']])await api('POST','/borrowers',{name,phone});await api('POST','/rentals',{itemId:1,personId:1});await api('POST','/rentals',{itemId:4,personId:2});toast('Demo rental data created');await load()}else if(action==='export')exportCsv();else if(action==='print')window.print();else if(action==='refresh')await load()}catch(err){toast(err.message,true)}});
document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){const q=e.target.value.toLowerCase().trim();$$('[data-search-row]').forEach(r=>r.hidden=!r.dataset.searchRow.includes(q))}});
$('#globalSearch').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const q=e.target.value.toLowerCase().trim();if(!q)return;const inBorrowers=state.borrowers.some(v=>v.name.toLowerCase().includes(q));const inEquipment=state.equipment.some(v=>v.name.toLowerCase().includes(q));if(inBorrowers||inEquipment){state.page=inBorrowers?'borrowers':'equipment';render();const box=$('[data-search]');if(box){box.value=q;box.dispatchEvent(new Event('input'))}}else toast('No matching borrower or equipment found')});
$('#refreshBtn').addEventListener('click',load);$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$('#modalClose').addEventListener('click',()=>$('#modal').close());$('#modalCancel').addEventListener('click',()=>$('#modal').close());window.addEventListener('keydown',e=>{if(e.key==='Escape')$('#sidebar').classList.remove('open')});load();setInterval(()=>{if(state.online)load()},30000);
</script>
</body></html>
